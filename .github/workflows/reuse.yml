name: REUSE Compliance Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  reuse-compliance:
    name: REUSE Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
